# Configuração de acesso ao PostgreSQL (ajuste usuário/senha para o seu ambiente).
# Também é possível sobrescrever com variáveis de ambiente:
# AGROBRIDGE_DB_URL, AGROBRIDGE_DB_USER, AGROBRIDGE_DB_PASSWORD
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/agrobridge
db.user=postgres
db.password=postgres
